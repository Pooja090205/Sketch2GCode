<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sketch2Code — Ultimate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
  <aside class="sidebar">
    <div class="header">Sketch2Code</div>

    <div class="tool-label">Shape Tools</div>
    <div class="tool-grid">
      <button class="shape-btn active" id="tool-sketch"><span>Smart</span></button>
      <button class="shape-btn" id="tool-freehand"><span>Freehand</span></button>
      <button class="shape-btn" id="tool-line"><span>Line</span></button>
      <button class="shape-btn" id="tool-rect"><span>Rect</span></button>
      <button class="shape-btn" id="tool-circle"><span>Circle</span></button>
      <button class="shape-btn" id="btnImport"><span>Import</span></button>
    </div>
    <input type="file" id="imgLoader" accept="image/*" style="display:none" />

    <div class="tool-label">Polygons</div>
    <select id="shapeDropdown" class="shape-select">
      <option value="" disabled selected>Select Polygon...</option>
      <option value="triangle">Triangle</option>
      <option value="pentagon">Pentagon</option>
      <option value="hexagon">Hexagon</option>
      <option value="star">Star</option>
    </select>

    <div class="tool-label">Properties & Depth</div>
    <div class="manual-grid" id="manualPanel">
      <div class="input-wrapper">
        <label>Pos X</label>
        <input type="number" id="inp-x" placeholder="-">
      </div>
      <div class="input-wrapper">
        <label>Pos Y</label>
        <input type="number" id="inp-y" placeholder="-">
      </div>
      <div class="input-wrapper">
        <label>Width / Len</label>
        <input type="number" id="inp-w" placeholder="-">
      </div>
      <div class="input-wrapper">
        <label>Height</label>
        <input type="number" id="inp-h" placeholder="-">
      </div>
      <div class="input-wrapper">
        <label>Radius</label>
        <input type="number" id="inp-r" placeholder="-">
      </div>
      
      <div class="input-wrapper">
        <label style="color: var(--accent);">Cut Depth</label>
        <input type="number" id="inp-d" value="2.0" step="0.1">
      </div>
    </div>

    <button id="micBtn" class="voice-trigger" style="margin-top: 15px;">
      <div class="dot"></div><span id="micText">Click to Speak</span>
    </button>

    <div class="tool-label">Simulation</div>
    <div style="font-size:11px; display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:5px;">
        <span>PLAYBACK SPEED</span>
        <span id="dispSpeed" style="color:var(--accent)">1.0x</span>
    </div>
    <input type="range" id="simSpeedSlider" min="0.1" max="5.0" step="0.1" value="1.0" class="slider">

    <div class="console" id="consoleLog">
      <div class="log-item">System ready.</div>
    </div>

    <button id="exportBtn" class="btn-primary">Generate G-Code</button>
  </aside>

  <div class="viewport" id="viewport">
    <canvas id="canvas"></canvas>
    <div id="voiceToast" class="voice-toast">Listening...</div>
    <div id="simLegend" class="sim-legend">
        <div class="legend-item"><div class="dot-cut"></div> Cutting Feed (G1)</div>
        <div class="legend-item"><div class="dot-rapid"></div> Rapid Travel (G0)</div>
    </div>
    <div class="bottom-toolbar">
      <button class="tool-btn active" id="modeDraw">Design View</button>
      <button class="tool-btn" id="modeSim">▶ Run Simulation</button>
      <button class="tool-btn" id="btnUndo">↶ Undo</button>
      <button class="tool-btn" id="btnReset" style="color:#ef4444">Clear All</button>
    </div>
  </div>
</div>

<script src="main.js" defer></script>
</body>
</html>
